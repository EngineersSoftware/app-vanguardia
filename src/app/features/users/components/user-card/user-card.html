<article
  appHoverEffect
  class="bg-white p-5 rounded-xl shadow-sm border border-slate-100 flex items-center justify-between"
>
  <div>
    <h3 class="font-bold text-slate-800 text-lg">{{ userData().name }}</h3>
    <p class="text-slate-500">{{ userData().email }}</p>
  </div>

  <button
    (click)="onDeleteClick()"
    class="bg-red-100 text-red-600 hover:bg-red-200 px-3 py-1 rounded-md font-semibold transition-colors"
  >
    Eliminar
  </button>
</article>
