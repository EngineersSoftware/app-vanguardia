<div class="max-w-5xl mx-auto p-8">
  <header class="mb-10">
    <h1 class="text-4xl font-extrabold text-slate-800">Panel de Gestion</h1>
    <p class="text-slate-500 mt-2">Total de usuarios: {{ totalUsers() }}</p>
  </header>

  <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
    <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-sm border border-slate-100 h-fit">
      <h2 class="text-xl font-bold text-slate-700 mb-6">Añadir Perfil</h2>
      <form [formGroup]="userForm" (ngSubmit)="addUser()" class="flex flex-col gap-5">
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">Nombre Completo</label>
          <input
            type="text"
            formControlName="name"
            class="w-full rounded-lg border-slate-200 bg-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 px-4 py-2 outline-none transition-all"
            placeholder="Ingresa tu nombre"
          />
        </div>
        <div>
          <label class="block text-sm font-semibold text-slate-600 mb-1">Correo Electrónico</label>
          <input
            type="email"
            formControlName="email"
            class="w-full rounded-lg border-slate-200 bg-slate-200 focus:bg-white focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200 px-4 py-2 outline-none transition-all"
            placeholder="Ingresa tu correo"
          />
        </div>
        <button
          type="submit"
          [disabled]="userForm.invalid"
          class="mt-2 w-full bg-indigo-600 text-white font-semibold py-3 px-4 rounded-lg hover:bg-indigo-700 disabled:bg-slate-300 disabled:cursor-not-allowed transition-colors"
        >
          Registrar
        </button>
      </form>
    </div>

    <div class="lg:col-span-2 flex flex-col gap-4">
      @if (isLoading()) {
        <div class="p-10 text-center">
          <span class="text-slate-400 font-medium animate-pulse text-lg">Sincronizando datos...</span>
        </div>
      } @else if (isEmpty()) {
        <div class="p-10 text-center">
          <span class="text-slate-400 font-medium">No hay usuarios registrados</span>
        </div>
      } @else {
        @for (user of users(); track user.id) {
          <div>
            <app-user-card
            [userData]="user"
            (deleteUser)="removeUser($event)"
            ></app-user-card>
          </div>
        }
      }
    </div>
  </div>
</div>
